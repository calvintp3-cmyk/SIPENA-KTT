# deploy/nginx-sipena.conf
# Konfigurasi Nginx Reverse Proxy untuk SIPENA KTT (Nuxt 3 Nitro node-server pada 127.0.0.1:3002)
# Menggantikan blok `/_next/static/` (Next.js legacy) menjadi `/_nuxt/` (Nuxt 3 + Vite bundles).
#
# Letakkan di: /etc/nginx/sites-available/sipena-ktt
# Lalu aktifkan: sudo ln -sf /etc/nginx/sites-available/sipena-ktt /etc/nginx/sites-enabled/sipena-ktt
# Uji & reload : sudo nginx -t && sudo systemctl reload nginx

# Batasi laju percobaan brute-force ke endpoint autentikasi admin
limit_req_zone $binary_remote_addr zone=sipena_auth_limit:10m rate=10r/m;

upstream sipena_nuxt_upstream {
    server 127.0.0.1:3002;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name sipena6503.caplinlab.my.id;

    # Redirect seluruh trafik HTTP ke HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sipena6503.caplinlab.my.id;

    # Sertifikat TLS Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/sipena6503.caplinlab.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sipena6503.caplinlab.my.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 5m;

    # Asset statis ter-hash milik Nuxt 3 / Vite (pengganti /_next/static/)
    location /_nuxt/ {
        proxy_pass http://sipena_nuxt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Font lokal yang dibundle @nuxt/fonts (jika aktif)
    location /_fonts/ {
        proxy_pass http://sipena_nuxt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Rate limiting khusus endpoint login admin & inisiasi Google OAuth
    location = /api/auth/login {
        limit_req zone=sipena_auth_limit burst=5 nodelay;
        proxy_pass http://sipena_nuxt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/google/login {
        limit_req zone=sipena_auth_limit burst=5 nodelay;
        proxy_pass http://sipena_nuxt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Aplikasi Nuxt SSR & Nitro API routes
    location / {
        proxy_pass http://sipena_nuxt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout lebih panjang untuk endpoint ekspor Excel (.xlsx) & stream SSR
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }
}

