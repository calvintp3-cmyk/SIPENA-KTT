# SIPENA-KTT Nginx Reverse Proxy Template
# Isolated on localhost:3002 — does not conflict with existing services on ports 3000, 3001, 8080.

limit_req_zone $binary_remote_addr zone=sipena_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name sipena.ktt-bps.example.id;

    # Maximum Excel/payload upload allowance
    client_max_body_size 10M;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Security headers are set once by Next.js in next.config.ts (avoid duplicate headers)

    # Auth brute-force protection at proxy layer
    location = /api/auth/login {
        limit_req zone=sipena_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
